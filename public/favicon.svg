<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 777 729">
  <!--
    El favicon de MashaCorp.

    Un solo archivo para los dos temas: en una barra de pestañas clara se
    pinta el símbolo oscuro, y en la oscura el claro. Sin esto el icono
    desaparece en uno de los dos, que es lo que le pasa a casi todos los
    favicones en negro cuando el navegador está en modo oscuro.
  -->
  <style>
    .casco { fill: #303030; }
    .lente { fill: #5E3030; }

    @media (prefers-color-scheme: dark) {
      .casco { fill: #D9D9D9; }
      .lente { fill: #917171; }
    }
  </style>
