name: Deploy Mashaec ERP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 138.68.45.117
          username: alej1405mc
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/erp.mashaec.net

            php artisan down --retry=60

            # Pase lo que pase de aquí en adelante, el ERP vuelve a estar en
            # línea al salir del script: con `set -e` cualquier error cortaba
            # la ejecución antes del `up` y dejaba el sitio en mantenimiento.
            trap 'php artisan up || true' EXIT

            PREV_COMMIT=$(git rev-parse HEAD)
            echo $PREV_COMMIT > /tmp/mashaec_prev_commit

            # Archivos sin seguimiento que el pull sobrescribiría: git aborta
            # el merge por ellos. Se apartan con su ruta a un respaldo fechado
            # en vez de borrarlos, por si llevan cambios hechos en el servidor.
            RESPALDO=~/respaldo-untracked-$(date +%F-%H%M%S)
            CHOQUES=$(git fetch origin main -q && git diff --name-only HEAD origin/main | while read f; do
              if [ -f "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then echo "$f"; fi
            done)

            if [ -n "$CHOQUES" ]; then
              echo "Apartando archivos sin seguimiento que bloquean el pull:"
              echo "$CHOQUES"
              echo "$CHOQUES" | while read f; do
                mkdir -p "$RESPALDO/$(dirname "$f")"
                mv "$f" "$RESPALDO/$f"
              done
              echo "Respaldo en: $RESPALDO"
            fi

            git pull origin main

            composer install --no-dev --optimize-autoloader
            npm ci
            npm run build

            PENDING=$(php artisan migrate:status --no-ansi 2>/dev/null | grep -c 'Pending' || true)
            if [ "$PENDING" -gt 0 ]; then
              echo "Ejecutando $PENDING migración(es) pendiente(s)..."
              php artisan migrate --force
            else
              echo "No hay migraciones pendientes."
            fi

            php artisan config:cache
            php artisan route:cache
            php artisan view:clear
            php artisan filament:assets
            php artisan queue:restart

            php artisan up

      - name: Rollback si falla
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 138.68.45.117
          username: alej1405mc
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/erp.mashaec.net
            trap 'php artisan up || true' EXIT
            PREV=$(cat /tmp/mashaec_prev_commit)
            git reset --hard $PREV
            composer install --no-dev --optimize-autoloader
            php artisan config:cache
            php artisan up
            echo "ROLLBACK ejecutado al commit $PREV"

